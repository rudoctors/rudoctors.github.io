name: Telegram moderation

# Модерация заявок «Добавить врача» (@rudoctors_moderation_bot).
# - issues: мгновенная отправка новой заявки в Telegram
# - schedule: обработка команд ✅/❌ (GitHub задерживает cron — от минут до часов)
# - push: попутная обработка команд при любом пуше (кроме карточек от самого бота)
# - workflow_dispatch: ручной запуск «проверить сейчас»
# Кнопки в Telegram — URL с предзаполненной командой: callback-нажатия Telegram
# ТЕРЯЕТ, если бот не слушает в момент нажатия (проверено E2E).
# Локальный `npm run tg:bot` можно запускать параллельно для мгновенной обработки:
# getUpdates разделяется, обработчики идемпотентны (409 в логе Actions — норма).

on:
  issues:
    types: [opened, labeled, reopened]
  push:
    paths-ignore:
      - "src/data/doctors/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: telegram-moderation
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync requests and process moderation buttons
        run: node scripts/telegram-bot.mjs --ci
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
