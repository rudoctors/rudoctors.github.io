name: Telegram moderation

# Модерация заявок «Добавить врача» (@rudoctors_moderation_bot).
# - issues: мгновенная отправка новой заявки в Telegram
# - schedule: обработка команд ✅/❌ (GitHub задерживает cron — от минут до часов)
# - push: попутная обработка команд при любом пуше (кроме карточек от самого бота)
# - workflow_dispatch: ручной запуск «проверить сейчас»
# Кнопки в Telegram — URL с предзаполненной командой: callback-нажатия Telegram
# ТЕРЯЕТ, если бот не слушает в момент нажатия (проверено E2E).
# Локальный `npm run tg:bot` можно запускать параллельно для мгновенной обработки:
# getUpdates разделяется, обработчики идемпотентны (409 в логе Actions — норма).

on:
  issues:
    types: [opened, labeled, reopened]
  push:
    paths-ignore:
      - "src/data/doctors/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: telegram-moderation
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Apps Script uses a least-privilege fine-grained PAT that can create an
      # Issue but cannot administer repository labels. Label only the strict,
      # server-generated doctor-intake format before the bot synchronises it.
      - name: Label verified doctor intake
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue?.title ?? "";
            const body = issue?.body ?? "";
            const isDoctorIntake =
              title.startsWith("Новый врач:") &&
              /(?:^|\n)CRM ID: DR-[A-Za-z0-9-]+(?:\r?$|\n)/m.test(body) &&
              body.includes("Отправлено через форму rudoctors.github.io/add-doctor/");

            if (!isDoctorIntake) {
              core.info("Issue is not a verified doctor-intake payload; leaving labels unchanged.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ["doctor-request"],
            });

      - name: Sync requests and process moderation buttons
        run: node scripts/telegram-bot.mjs --ci
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
