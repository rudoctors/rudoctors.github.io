name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mon/Thu 05:00 UTC — refresh sources + rebuild
    - cron: "0 5 * * 1"
    - cron: "0 5 * * 4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HAS_TRANSLATE_KEY: ${{ secrets.TRANSLATE_API_KEY != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Refresh data from public sources (best-effort; seed merges in-place)
      - name: Fetch sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/fetch-sheet.mjs || echo "sheet failed, keep cached"
          node scripts/fetch-citilab.mjs || echo "citilab failed, keep cached"
          node scripts/seed.mjs
          node scripts/tag-en-reviews.mjs

      - name: Translate EN→RU reviews
        if: env.HAS_TRANSLATE_KEY == 'true'
        run: node scripts/translate-reviews.mjs
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}

      - run: npm run check
      - run: npm run build

      - name: IndexNow ping
        run: node scripts/indexnow.mjs dist
        continue-on-error: true

      # Commit data diffs on schedule only (skip push trigger to avoid loops)
      - name: Commit refreshed data
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data scripts/*.json || true
          git add -A src/data package-lock.json || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): scheduled source refresh"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
